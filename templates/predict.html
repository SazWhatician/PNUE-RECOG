{% extends "base.html" %}
{% block content %}
<section class="min-h-screen pt-24 md:pt-40 pb-20 px-6 md:px-10 bg-[#050505] text-white">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10 md:gap-20 items-center">
        
        <div class="reveal relative rounded-2xl md:rounded-3xl overflow-hidden border border-white/10">
            <img src="{{ url_for('static', filename='uploads/' + filename) }}" class="w-full grayscale opacity-70 block">
            <div class="scan-line"></div>
        </div>

        <div class="space-y-8 md:space-y-10">
            <div class="reveal">
                <h2 class="text-emerald-500 text-[10px] tracking-[0.5em] uppercase font-bold mb-2 md:mb-4 italic">Analysis Complete</h2>
                <h1 class="text-4xl md:text-6xl font-syne tracking-tighter uppercase">{{ result }}</h1>
            </div>

            <div class="reveal">
                <div class="flex justify-between mb-4">
                    <span class="text-[10px] tracking-widest uppercase opacity-40 font-bold">AI Confidence</span>
                    <span class="text-xl md:text-2xl font-syne text-emerald-500">{{ confidence }}%</span>
                </div>
                <div class="h-[2px] w-full bg-white/5 rounded-full overflow-hidden">
                    <div id="confBar" class="h-full bg-emerald-500" data-value="{{ confidence }}"></div>
                </div>
            </div>

            <div class="reveal pt-6 md:pt-10 border-t border-white/5">
                <a href="/" class="text-[10px] tracking-[0.3em] uppercase font-bold hover:text-emerald-500 transition-colors inline-flex items-center">
                    <span class="mr-3">←</span> New Diagnosis
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
