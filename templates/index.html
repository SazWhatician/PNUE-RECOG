{% extends "base.html" %}
{% block content %}
<section class="min-h-screen flex flex-col items-center justify-center bg-[#050505] text-white px-6">
    <div class="text-center w-full max-w-4xl">
        <h1 class="reveal text-5xl sm:text-7xl md:text-9xl font-syne leading-none mb-6 md:mb-8 tracking-tighter">
            AI <span class="text-emerald-500 italic">PULSE.</span>
        </h1>
        <p class="reveal text-gray-500 max-w-xs md:max-w-lg mx-auto mb-10 md:mb-12 uppercase tracking-[0.2em] text-[10px] md:text-xs leading-loose">
            High-precision neural diagnostics for radiographic imaging.
        </p>

        <form action="/predict" method="post" enctype="multipart/form-data" id="upForm" class="reveal w-full max-w-sm mx-auto">
            <label class="group relative px-8 md:px-16 py-6 md:py-8 border border-white/10 rounded-full cursor-pointer overflow-hidden block hover:border-emerald-500 transition-all duration-500">
                <span class="relative z-10 tracking-[0.3em] uppercase text-[10px] md:text-xs font-bold">Upload X-Ray</span>
                <input type="file" name="file" class="hidden" onchange="document.getElementById('upForm').submit()">
                <div class="absolute inset-0 bg-emerald-600/10 translate-y-full group-hover:translate-y-0 transition-transform duration-700"></div>
            </label>
        </form>
    </div>
</section>
{% endblock %}
